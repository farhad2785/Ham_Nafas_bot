# version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    env_file:
      - .env
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fanoos_user -d ham_nafas_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build: .
    restart: always
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    # اجرای ربات با watchfiles برای محیط توسعه
    # command: watchfiles "python main.py"
    command: python main.py

volumes:
  postgres_data: